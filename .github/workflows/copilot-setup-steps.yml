# Environment setup for the GitHub Copilot cloud coding agent.
#
# Copilot runs the `copilot-setup-steps` job below before it starts working on
# a task, so the agent lands in a repo where both environments are ready:
#   - pixi (maintainer tooling): the default environment is solved from
#     pixi.lock and the pre-commit hook environments are already warm, so the
#     required quality gate (`pixi run pre-commit-all`) works without setup.
#   - uv (workshop Python env): `.venv` is synced from uv.lock, so
#     `uv run pytest` and the notebooks' imports work.
#
# Copilot discovers AGENTS.md and the skills under .agents/skills/ on its own;
# nothing here needs to point at them.
#
# Constraints from GitHub: the job must be named exactly `copilot-setup-steps`,
# the file must live on the default branch, and only `steps`, `permissions`,
# `runs-on`, `services`, `snapshot`, and `timeout-minutes` are honored.

name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi and the default environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          locked: true
          activate-environment: true

      - name: Pre-warm pre-commit hook environments
        run: pre-commit install-hooks

      # Keep version in sync with the uv image tag in .devcontainer/Dockerfile.
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.6.14"
          enable-cache: true

      - name: Sync the workshop environment
        run: uv sync --locked
